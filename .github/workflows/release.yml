name: Create Thunderbird Addon Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow only when tags starting with 'v' are pushed (e.g., v1.0.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission allowing GitHub Actions to create releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Thunderbird Addon (.xpi)
        run: |
          # Zip the extension files into an .xpi file.
          # Exclude git/GitHub metadata files or unnecessary development scripts.
          zip -r addon.xpi . -x "*.git*" ".github*" "README.md"
          
          # Note: If your source files live inside a specific folder like 'src/', 
          # change the line above to: cd src && zip -r ../addon.xpi .

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: addon.xpi
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish to Thunderbird Add-ons
        uses: kewisch/action-web-ext@v2
        with:
          cmd: sign
          source: addon.xpi
          channel: listed
          apiUrlPrefix: "https://addons.thunderbird.net/api/v4"
          apiKey: ${{ secrets.THUNDERBIRD_API_KEY }}
          apiSecret: ${{ secrets.THUNDERBIRD_API_SECRET }}
          releaseNotes: |
            - Added a new Review Popup to preview changes in a diff view before inserting
            - Added 'Try Again' functionality to re-run the AI
            - Added date and day-of-week validation to the default AI prompt
            - Minor UI adjustments on the options page
          approvalNotes: "Added a popup UI to review AI changes before inserting them into the compose window."

